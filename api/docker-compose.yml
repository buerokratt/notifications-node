name: buerokratt-notification-node

services:
  api:
    container_name: buerokratt-notification-node
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile
      target: production
    image: buerokratt-notification-node:latest
    env_file:
      - ./config/production.env
    environment:
      RABBITMQ_URL: amqp://rabbitmq:5672?heartbeat=30
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports:
      - 3000:3000
      - 3001:3001
    restart: always

  rabbitmq:
    image: 'rabbitmq:4.3.0-alpine'
    ports:
      - 5672:5672
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
