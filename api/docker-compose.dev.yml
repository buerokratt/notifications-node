name: buerokratt-notification-node-dev

services:
  api:
    container_name: buerokratt-notification-node-dev
    platform: linux/amd64
    build:
      context: .
      dockerfile: Dockerfile.dev
    image: buerokratt-notification-node:dev
    env_file:
      - ./config/development.env
    environment:
      RABBITMQ_URL: amqp://rabbitmq:5672?heartbeat=30
    depends_on:
      rabbitmq:
        condition: service_healthy
    ports:
      - '3000:3000'
      - '3001:3001'
    restart: always

  rabbitmq:
    image: 'rabbitmq:4.3-management-alpine'
    ports:
      - 5672:5672
      - 15672:15672 # Management UI
    healthcheck:
      test: ['CMD', 'rabbitmq-diagnostics', 'ping']
      interval: 10s
      timeout: 5s
      retries: 5
