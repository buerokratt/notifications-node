name: Install pnpm dependencies
description: Set up Node.js and pnpm, then install project dependencies.

inputs:
  working-directory:
    description: Directory containing package.json and pnpm-lock.yaml.
    required: true

runs:
  using: composite
  steps:
    - name: Setup pnpm
      uses: pnpm/action-setup@v6
      with:
        version: 10.13.1

    - name: Setup Node.js
      uses: actions/setup-node@v5
      with:
        node-version: 24
        cache: pnpm
        cache-dependency-path: ${{ inputs.working-directory }}/pnpm-lock.yaml

    - name: Install dependencies
      shell: bash
      working-directory: ${{ inputs.working-directory }}
      run: pnpm install --frozen-lockfile
